[project]
name = "document-qa"
version = "0.5.0"
description = "Bounded, source-grounded document question answering"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1",
  "pydantic-settings>=2.8,<3", "openai>=1.68,<3", "pypdf>=5.4,<7",
  "langchain-text-splitters>=0.3,<2", "numpy>=2.2,<3", "rank-bm25>=0.2.2,<1",
  "tiktoken>=0.9,<1", "anyio>=4.8,<5",
]
[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1", "ruff>=0.11,<1", "pytest-cov>=6,<8", "reportlab>=4.3,<5"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
[tool.coverage.run]
source = ["app"]
