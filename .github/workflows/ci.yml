name: Checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.28"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest --cov=app --cov-report=term-missing
      - name: Build and start restricted Docker containers
        run: |
          touch .env.local
          docker compose -p document-qa-smoke -f compose.yaml -f compose.smoke.yaml build app
          docker compose -p document-qa-smoke -f compose.yaml -f compose.smoke.yaml up --no-build --wait --wait-timeout 120
      - name: Test Docker runtime
        run: |
          docker compose -p document-qa-smoke -f compose.yaml -f compose.smoke.yaml exec -T app id
          uv run python -m scripts.docker_smoke
      - name: Container diagnostics and cleanup
        if: always()
        run: |
          docker compose -p document-qa-smoke -f compose.yaml -f compose.smoke.yaml logs --no-color
          docker compose -p document-qa-smoke -f compose.yaml -f compose.smoke.yaml down --volumes
