# CI-only override. Never use these mock AI settings for real questionnaire answers.
services:
  app:
    image: document-qa:smoke
    environment:
      OPENAI_API_KEY: docker-smoke-only
      OPENAI_BASE_URL: http://mock:9000/v1
      APP_API_TOKEN: ""
    depends_on:
      - mock
  mock:
    image: document-qa:smoke
    command: ["/app/.venv/bin/python", "/mock.py"]
    volumes:
      - ./scripts/docker_mock_provider.py:/mock.py:ro
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import socket; socket.create_connection(('127.0.0.1', 9000), 3).close()"]
      interval: 2s
      timeout: 4s
      retries: 10
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
